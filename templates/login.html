<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow">
        <h1 class="text-2xl font-bold text-center mb-6">🏠 Property Viewer</h1>
        {% if error %}
        <div class="mb-4 p-3 bg-red-50 text-red-600 rounded">{{ error }}</div>
        {% endif %}
        <form method="POST" class="space-y-4">
            <div>
                <label class="block mb-2 font-medium">Email</label>
                <input type="email" name="email" required class="w-full p-3 border rounded">
            </div>
            <div>
                <label class="block mb-2 font-medium">Password</label>
                <input type="password" name="password" required class="w-full p-3 border rounded">
            </div>
            <button type="submit" class="w-full p-3 bg-blue-600 text-white rounded hover:bg-blue-700">Login</button>
        </form>
        <p class="text-center mt-4 text-sm">Don't have an account? <a href="/register" class="text-blue-600 hover:underline">Register</a></p>
    </div>
</body>
</html>
